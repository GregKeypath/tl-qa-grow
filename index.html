<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pod C GROW Coaching</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f9461'/%3E%3Cpath d='M32 50V30' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 34c0-9 6-15 16-15 0 10-6 15-16 15zM32 30c0-7-5-12-13-12 0 8 5 12 13 12z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ee;--panel:#fff;--ink:#24262b;--muted:#61656d;--faint:#a2a4aa;--line:#e6e3dc;--field:#f6f5f1;--fieldhover:#ece9e3;--focus:#4a7bd8;
  --g:#3d68cc;--g-bg:#e7edfb;--r:#c76a1c;--r-bg:#fdeedd;--o:#6a5be0;--o-bg:#efedff;--w:#1f9461;--w-bg:#e1f5ea;
  --dnm:#e23950;--dnm-bg:#ffe9ec;--meets:#a67c00;--meets-bg:#fff3bf;--exc:#17a673;--exc-bg:#e3f8ef;
  --unsw:#f2b705;--unsw-ink:#4a3500;--unsw-soft:#fff6d6;--mbs:#0b5cb0;--mbs-soft:#e5effb;
  --shadow:0 1px 2px rgba(36,38,43,.05);
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--g)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok i{background:var(--exc)}.chip.err i{background:var(--dnm)}.chip.load i{background:var(--meets)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink)}
.ghost:hover{background:var(--field)}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 59px)}
.side{padding:18px 12px;border-right:1px solid var(--line);background:#fbfaf8}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
.side a i{width:10px;height:10px;border-radius:3px;background:var(--nc)}
.side a:hover{background:var(--field)}
.side a.on{background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.side a b{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.side .hint{margin:22px 12px 0;font-size:12px;color:var(--muted)}
main{padding:24px 28px 60px;min-width:0;max-width:1320px}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .sp{flex:1}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:9px 16px;background:var(--ink);color:#fff;font-weight:600}
.btn:hover{background:#3a3d44}
.btn.green{background:var(--w)}.btn.green:hover{background:#18784e}
.btn.blue{background:var(--g)}.btn.blue:hover{background:#2f55ad}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--g);font-weight:500}
.danger{color:var(--dnm)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:15px}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.section-t{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-t h2{font-size:18px}
.section-t .tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag.unsw{background:var(--unsw-soft);color:var(--unsw-ink)}
.tag.mbs{background:var(--mbs-soft);color:var(--mbs)}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.adv{cursor:pointer;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--pc);transition:transform .12s,box-shadow .12s}
.adv:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(36,38,43,.08)}
.adv.unsw{--pc:var(--unsw)}.adv.mbs{--pc:var(--mbs)}
.adv-h{display:flex;align-items:flex-start;gap:10px}
.adv-h h3{font-size:17px}
.adv-h .meta{font-size:12px;color:var(--muted)}
.adv-h .score{margin-left:auto;text-align:right}
.score b{display:block;font:600 24px/1 var(--mono)}
.score span{font-size:11px;color:var(--muted)}
.mini{display:grid;gap:5px}
.mini-row{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bc,var(--faint))}
.r-dnm{--bc:var(--dnm);--pb:var(--dnm-bg);--pt:var(--dnm)}
.r-meets{--bc:var(--meets);--pb:var(--meets-bg);--pt:var(--meets)}
.r-exc{--bc:var(--exc);--pb:var(--exc-bg);--pt:var(--exc)}
.r-none{--bc:var(--faint);--pb:var(--field);--pt:var(--muted)}
.mono{font-family:var(--mono)}
.adv-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pb,var(--field));color:var(--pt,var(--muted));white-space:nowrap}
.pill.pass{--pb:var(--exc-bg);--pt:var(--exc)}
.pill.fail{--pb:var(--dnm-bg);--pt:var(--dnm)}
.pill.st-prep{--pb:#eceef1;--pt:#5d636c}
.pill.st-plan{--pb:var(--g-bg);--pt:var(--g)}
.pill.st-goal{--pb:var(--o-bg);--pt:var(--o)}
.pill.st-done{--pb:var(--w-bg);--pt:var(--w)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font:600 24px/1.2 var(--mono);margin-top:2px}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.qrow{display:grid;grid-template-columns:34px minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.qrow:last-child{border-bottom:0}
.qrow .qk{font:600 12px var(--mono);color:var(--muted)}
.qrow .focus{font-size:10.5px;font-weight:700;color:var(--dnm);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.secrow{display:grid;grid-template-columns:130px 1fr 54px 104px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.calls{display:flex;flex-direction:column}
.call{border-bottom:1px solid var(--line)}
.call:last-child{border-bottom:0}
.call-h{display:grid;grid-template-columns:auto 92px 74px 54px 84px minmax(0,1fr) 20px;gap:10px;align-items:center;padding:9px 4px;cursor:pointer;font-size:13px}
.call-h:hover{background:var(--field)}
.call-h .foc{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-h .car{color:var(--faint);transition:transform .15s}
.call.open .car{transform:rotate(90deg)}
.call-d{display:none;padding:4px 6px 16px}
.call.open .call-d{display:block}
.qd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.qd > div{background:var(--field);border-radius:9px;padding:10px 12px;font-size:13px}
.qd .qh{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:600}
.qd .opp{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:#5a4a00}
.kv{font-size:13px;margin:8px 0}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fail-list{margin:6px 0 0;padding-left:18px;color:var(--dnm);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hist{display:grid;gap:10px}
.hcard{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.hcard:hover{background:var(--field)}
.hcard .d{font:500 13px var(--mono);color:var(--muted)}
.hcard .t{font-weight:600}
.hcard .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:18px}
.step{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;color:var(--muted)}
.step i{font:600 13px var(--mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--field);font-style:normal;flex:none}
.step b{display:block;color:var(--ink);font-size:14px}
.step span{font-size:12px}
.step.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.step.on i{background:var(--ink);color:#fff}
.step.done i{background:var(--w);color:#fff}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
label.f:first-child{margin-top:0}
.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 11px;outline:none;transition:border-color .12s,background .12s}
.in:hover{background:var(--fieldhover)}
.in:focus{border-color:var(--focus);background:#fff}
textarea.in{resize:vertical;min-height:70px;line-height:1.5}
.pick{display:grid;grid-template-columns:22px 86px 54px 72px minmax(0,1fr);gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pick:hover{background:var(--field)}
.pick input{margin:0;width:16px;height:16px;accent-color:var(--w)}
.pick .foc{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-list{max-height:430px;overflow:auto;border-top:1px solid var(--line);margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage{border-top:4px solid var(--sc);padding-top:14px}
.stage.goal{--sc:var(--g);--sb:var(--g-bg)}.stage.reality{--sc:var(--r);--sb:var(--r-bg)}.stage.options{--sc:var(--o);--sb:var(--o-bg)}.stage.will{--sc:var(--w);--sb:var(--w-bg)}
.stage-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stage-h .L{width:32px;height:32px;border-radius:9px;background:var(--sb);color:var(--sc);display:grid;place-items:center;font:700 17px var(--display)}
.stage-h h3{font-size:17px}
.stage-h span{font-size:12px;color:var(--muted)}
.ev{background:var(--sb);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:8px}
.ev q{font-style:italic}
.ev small{display:block;color:var(--muted);margin-top:3px}
.tip{font-size:12.5px;color:var(--muted);margin-top:8px}
.tip b{color:var(--ink)}
.item{display:grid;gap:8px;border-left:4px solid var(--g)}
.item-h{display:flex;gap:10px;align-items:center}
.item-h .num{font:600 14px var(--mono);color:var(--g);width:22px;text-align:center;flex:none}
.item-h .in{flex:1;min-width:0}
.grp{border-top:4px solid var(--bc)}
.grp .stage-h .pill{background:var(--pb);color:var(--pt)}
.preview{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;font-size:14px}
.preview p{margin:0 0 10px}.preview ul{margin:0 0 10px;padding-left:22px}
.qform{margin-bottom:14px}
.sp5{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sp5 label,.pickopt{cursor:pointer}
.sp5 input,.pickopt input{position:absolute;opacity:0;pointer-events:none}
.sp5 span,.pickopt span{display:inline-grid;place-items:center;min-width:38px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:600 14px var(--mono);color:var(--muted)}
.sp5 .s0 span{font:500 12.5px var(--sans)}
.sp5 .s1 input:checked+span,.sp5 .s2 input:checked+span{background:var(--dnm-bg);border-color:var(--dnm);color:var(--dnm)}
.sp5 .s3 input:checked+span{background:var(--meets-bg);border-color:var(--meets);color:var(--meets)}
.sp5 .s4 input:checked+span,.sp5 .s5 input:checked+span{background:var(--exc-bg);border-color:var(--exc);color:var(--exc)}
.sp5 .s0 input:checked+span{background:#fff;border-color:var(--ink);color:var(--ink)}
.pickopt input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.ghost.msel{background:var(--w-bg);border-color:var(--w);color:var(--w);font-weight:600}
.notes-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.qlist{margin:6px 0 0;padding-left:20px;font-size:13.5px}
.qlist li{margin-bottom:5px}
.copyrow{display:flex;gap:8px;align-items:flex-start}
.copyrow > :first-child{flex:1;min-width:0}
.cbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cbtn:hover{background:var(--field);color:var(--ink)}
.kr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:8px}
.kr > b{font:600 13px var(--mono);color:var(--o);padding-top:10px;text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.callout{background:#fff8e1;border:1px solid #f3e0a0;border-radius:10px;padding:10px 14px;font-size:13px;color:#5a4a00;margin-bottom:14px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:var(--field)}
.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.busy{position:fixed;inset:0;background:rgba(243,242,238,.75);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50}
.busy.hidden{display:none}
.busy-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 28px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(36,38,43,.12)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--w);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--dnm)}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:480px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(36,38,43,.35)}
.save{font-size:12px;color:var(--muted)}
@media (max-width:1100px){.split,.notes-stage{grid-template-columns:1fr}.qd{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:flex;gap:4px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .side a{margin:0;white-space:nowrap}
  .side .hint{display:none}
  main{padding:18px 16px 50px}
  .top{padding:10px 16px}
  .top .chip{display:none}
  .tiles,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.guide{grid-template-columns:1fr}
  .call-h{grid-template-columns:auto 84px 54px 70px 20px}
  .call-h .ty,.call-h .foc{display:none}
  .pick{grid-template-columns:22px 80px 48px minmax(0,1fr)}
  .pick .res{display:none}
  .secrow{grid-template-columns:110px 1fr 44px}
  .secrow .pill{display:none}
  .qrow{grid-template-columns:30px minmax(0,1fr) 40px}
  .qrow .bar{display:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/advisers">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#1f9461"/><path d="M32 50V30" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 34c0-9 6-15 16-15 0 10-6 15-16 15zM32 30c0-7-5-12-13-12 0 8 5 12 13 12z" fill="#fff"/></svg>
    <div><b>Pod C GROW Coaching</b><span>QA coaching record keeper</span></div>
  </a>
  <div class="sp"></div>
  <span class="save" id="saveState"></span>
  <span class="chip load" id="qaChip"><i></i>Loading QA data</span>
</header>
<div class="shell">
  <nav class="side" id="side">
    <a href="#/advisers" data-nav="advisers" style="--nc:var(--w)"><i></i>Advisers</a>
    <a href="#/sessions" data-nav="sessions" style="--nc:var(--g)"><i></i>Sessions<b id="openCount"></b></a>
    <a href="#/guide" data-nav="guide" style="--nc:var(--o)"><i></i>GROW guide</a>
    <div class="hint">QA findings come live from the BU2 QA dashboard. Sessions save automatically.</div>
  </nav>
  <main id="main"></main>
</div>
<div class="busy hidden" id="busy"><div class="busy-card"><span class="spin"></span><b id="busyMsg">Working</b></div></div>
<div id="toast"></div>
<script>
const QA_BASE = 'https://keypath-au.github.io/BU2-Team-Dashboard/';
const QA_URL = QA_BASE + 'qa-dashboard.html';
const DB = 'https://unsw-team-calendar-default-rtdb.asia-southeast1.firebasedatabase.app/grow_coaching';
const MODEL = 'gemini-3.6-flash';
const ADVISERS = [
  { name: 'Amelia Churchill', partner: 'UNSW' },
  { name: 'Andrew Wedderburn', partner: 'UNSW' },
  { name: 'Daljeet Sahota', partner: 'UNSW' },
  { name: 'James Miller', partner: 'UNSW' },
  { name: 'Kimberley Hornlimann', partner: 'UNSW' },
  { name: 'Priscilla Samuel', partner: 'UNSW' },
  { name: 'Stephanie Scriva', partner: 'UNSW' },
  { name: 'Ananya Rao', partner: 'MBS' },
  { name: 'Emma Arjoon', partner: 'MBS' },
  { name: 'Inuri Nethisinghe', partner: 'MBS' }
];

const isNum = v => typeof v === 'number' && !isNaN(v);

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const today = () => iso(new Date());
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s, yr) { if (!s) return ''; const p = s.split('-'); if (p.length < 3) return s; return (+p[2]) + ' ' + MON[+p[1] - 1] + (yr === false ? '' : ' ' + p[0]); }

function toText(x) {
  if (x == null) return '';

  if (typeof x === 'object') return Object.values(x).map(toText).filter(Boolean).join(' ');

}
const clip = (s, n) => { s = toText(s).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function rating5(v) {
  if (!isNum(v)) return { label: 'No data', cls: 'r-none' };
  const f = Math.floor(Math.round(v * 1000) / 1000);
  if (f >= 4) return { label: 'Exceeds', cls: 'r-exc' };
  if (f >= 3) return { label: 'Meets', cls: 'r-meets' };
  return { label: 'Does not meet', cls: 'r-dnm' };
}
const ratingPct = p => rating5(isNum(p) ? p / 20 : null);
function ratingWord(r) {

}

function scoreRating(v) { return v >= 4 ? 'Exceeds' : v >= 3 ? 'Meets' : 'Does Not Meet'; }
function normManual(c) {
  c.manual = true;
  c.interactionId = c.id;
  c.interactionDate = c.callDate || ((c.qaMonth || '') + '-01');
  c.questions = c.questions || {};
  QK.forEach(k => { const q = c.questions[k]; if (q && isNum(q.score)) q.rating = scoreRating(q.score); });
  c.scored = QK.some(k => c.questions[k] && isNum(c.questions[k].score));
  c.sections = {};
  let tw = 0, tot = 0;
  SECTIONS.forEach(s => {
    const v = s.qs.map(k => c.questions[k] && c.questions[k].score).filter(isNum);
    if (v.length) { const pct = avg(v) * 20; c.sections[s.key] = { pct }; tw += WEIGHTS[s.key]; tot += pct * WEIGHTS[s.key]; }
  });
  c.overallScore = tw ? Math.round(tot / tw) : null;
  c.compliance = c.compliance || {};
  c.result = c.compliance.result === 'Fail' ? 'Auto-Fail' : c.scored ? 'Pass' : '';
  return c;
}
async function loadManual() {

function cdl(c) {
  if (c.manual && !c.callDate) return (c.qaMonth ? monthLabel(c.qaMonth) : 'No date') + (c.label ? ', ' + c.label : '');
  return fmtDate(c.interactionDate) + (c.manual && c.label ? ', ' + c.label : '');

function resultPill(c) {

  return c.result === 'Auto-Fail' ? '<span class="pill fail">Auto-fail</span>' : '<span class="pill pass">Pass</span>';
}
function inWindow(calls, w) {
  if (w === 'all') return calls;
  if (/^[0-9]{4}-[0-9]{2}$/.test(w)) return calls.filter(c => String(c.interactionDate).startsWith(w));
  const from = addDays(today(), -(+w));
  return calls.filter(c => String(c.interactionDate) >= from);
}
function stats(calls) {
  const r = { n: calls.length, overall: null, sec: {}, q: {}, fails: 0 };
  r.overall = avg(calls.filter(c => isNum(c.overallScore) || c.result === 'Auto-Fail').map(c => c.result === 'Auto-Fail' ? 0 : c.overallScore));
  r.raw = avg(calls.map(c => c.overallScore).filter(isNum));
  calls.forEach(c => { const cr = c.compliance && c.compliance.result; if (cr === 'Fail' || cr === 'Auto-Fail' || c.result === 'Auto-Fail') r.fails++; });
  SECTIONS.forEach(s => { r.sec[s.key] = avg(calls.map(c => c.sections && c.sections[s.key] && c.sections[s.key].pct).filter(isNum)); });
  QK.forEach(k => { r.q[k] = avg(calls.map(c => c.questions && c.questions[k] && c.questions[k].score).filter(isNum)); });
  return r;
}
function weakest(st, n) {
  return QK.filter(k => isNum(st.q[k]) && st.q[k] < 4).sort((a, b) => st.q[a] - st.q[b]).slice(0, n);
}

function getPath(o, p) { return p.split('.').reduce((x, k) => x == null ? undefined : x[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let x = o;
  ks.slice(0, -1).forEach((k, i) => { if (x[k] == null || typeof x[k] !== 'object') x[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; x = x[k]; });

const BUILT_KEY = 'GEMINI_KEY_PLACEHOLDER';
const hasBuiltKey = () => !!BUILT_KEY && BUILT_KEY !== 'GEMINI_KEY_' + 'PLACEHOLDER';
function getKey() {
  try { return localStorage.getItem('grow-gemini-key') || (hasBuiltKey() ? BUILT_KEY : '') || localStorage.getItem('unsw-gemini-key') || ''; } catch (e) { return hasBuiltKey() ? BUILT_KEY : ''; }
}
function deDash(x) {
  if (typeof x === 'string') return x.replace(/\s*—\s*/g, ', ').replace(/\s+–\s+/g, ', ').replace(/–/g, '-');
  if (Array.isArray(x)) return x.map(deDash);
  if (x && typeof x === 'object') { const o = {}; for (const k in x) o[k] = deDash(x[k]); return o; }
  return x;
}
async function ai(prompt) {
  const key = getKey();
  if (!key) throw new Error('The AI key is missing from the site. Check the GEMINI_KEY secret in GitHub and redeploy.');
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + encodeURIComponent(key), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.4, maxOutputTokens: 16000, responseMimeType: 'application/json' } })
  });
  let data = null;
  try { data = await res.json(); } catch (e) { }
  if (!res.ok) {
    const m = data && data.error && data.error.message;
    if (res.status === 401 || res.status === 403 || /api key/i.test(m || '')) throw new Error('Gemini refused the key. Check the GEMINI_KEY secret in GitHub. ' + (m || ''));
    throw new Error('Gemini error ' + res.status + (m ? ': ' + m : ''));
  }
  const cand = data && data.candidates && data.candidates[0];
  if (!cand) throw new Error('Gemini returned no answer. Try again.');
  if (cand.finishReason === 'MAX_TOKENS') throw new Error('The answer was cut off before it finished. Try again with fewer calls ticked.');
  let raw = ((cand.content && cand.content.parts) || []).filter(p => !p.thought).map(p => p.text || '').join('');
  raw = raw.replace(/```json\s*/g, '').replace(/```/g, '').trim();
  const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
  if (s < 0 || e < 0) throw new Error('Gemini did not return the expected format. Try again.');
  return deDash(JSON.parse(raw.slice(s, e + 1)));
}

function brief(calls) {
  if (!calls.length) return 'No QA evaluations were selected for this session.';
  const st = stats(calls);
  const dates = calls.map(c => c.interactionDate).sort();
  const L = [];
  L.push(calls.length + ' evaluated calls from ' + fmtDate(dates[0]) + ' to ' + fmtDate(dates[dates.length - 1]) + '. Average overall score ' + (isNum(st.overall) ? Math.round(st.overall) + '%' : 'n/a') + ' with auto-fails counted as 0, or ' + (isNum(st.raw) ? Math.round(st.raw) + '%' : 'n/a') + ' on call quality alone. Compliance fails: ' + st.fails + '.');
  L.push('Section averages: ' + SECTIONS.map(s => s.label + ' ' + (isNum(st.sec[s.key]) ? (st.sec[s.key] / 20).toFixed(1) + '/5 (' + ratingPct(st.sec[s.key]).label + ')' : 'n/a')).join('; ') + '.');
  L.push('Question averages: ' + QK.map(k => k.toUpperCase() + ' ' + (isNum(st.q[k]) ? st.q[k].toFixed(1) : 'n/a')).join(', ') + '.');
  calls.slice().sort((a, b) => String(a.interactionDate).localeCompare(String(b.interactionDate))).forEach(c => {
    L.push('');
    L.push('CALL ' + cdl(c) + ' | ' + (c.callType || '') + ' | ' + (c.duration || '') + ' | overall ' + (isNum(c.overallScore) ? c.overallScore + '%' : 'n/a') + ' | ' + (c.result || ''));
    const comp = c.compliance || {};
    const cf = (comp.checklist || []).filter(x => x.status && x.status !== 'Pass');
    L.push('Compliance: ' + (comp.result || 'n/a') + (cf.length ? '. Failed: ' + cf.map(x => x.requirement + ' (' + clip(x.evidence, 220) + ')').join('; ') : '') + (comp.note ? '. Note: ' + clip(comp.note, 300) : ''));
    if (c.questions) QK.forEach(k => {
      const q = c.questions[k]; if (!q) return;
      let line = k.toUpperCase() + ' ' + QTEXT[k] + ': ' + (q.rating || 'n/a') + (isNum(q.score) ? ' (' + q.score + '/5)' : '') + '. ' + clip(q.rationale, 380);
      if (isNum(q.score) && q.score <= 3 && q.evidence && q.evidence.length) line += ' Evidence: ' + clip(q.evidence[0], 260);
      if (q.coachingOpportunity) line += ' Coaching opportunity: ' + clip(q.coachingOpportunity, 300);
      L.push(line);
    });
    if (c.primaryCoachingFocus) L.push('Primary coaching focus: ' + clip(c.primaryCoachingFocus, 200));
    if (c.coachingRecommendation) L.push('Evaluator recommendation: ' + clip(c.coachingRecommendation, 600));
    if (c.strengths && toText(c.strengths)) L.push('Strengths: ' + clip(c.strengths, 300));
  });
  return L.join('\n');
}

  const pl = s.plan;

  const calls = (s.callIds || []).map(callById).filter(Boolean), st = stats(calls);
  if (!(pl.items || []).length) pl.items = [{ title: pl.focus, detail: '', calls: null, quote: '', date: '' }];
  const it = pl.items[0];
  let h = '<div class="card item" style="margin-bottom:14px"><div class="item-h"><h2 style="margin:0">Coaching focus</h2><span style="flex:1"></span>' + (it.calls ? '<span class="pill st-plan">Came up in ' + it.calls + ' of ' + calls.length + ' calls</span>' : '') + '</div>';
  h += '<input class="in" data-bind="plan.focus" value="' + esc(pl.focus) + '" style="font-weight:600;font-size:15px">';
  h += '<label class="f">What to coach and what good looks like</label><textarea class="in" rows="3" data-bind="plan.items.0.detail">' + esc(it.detail) + '</textarea>';
  if (it.quote) h += '<div class="ev"><q>' + esc(it.quote) + '</q><small>' + esc(fmtDate(it.date)) + '</small></div>';
  h += '<div class="row" style="margin-top:6px"><label class="f" style="margin:0">Coaching questions you could ask' + ((it.questions || []).length ? ' (one per line)' : '') + '</label><span style="flex:1"></span><button class="btn blue sm" data-act="questions">' + ((it.questions || []).length ? 'Rewrite coaching questions' : 'Suggest coaching questions') + '</button></div>';
  if ((it.questions || []).length) h += '<textarea class="in" rows="' + Math.max(4, it.questions.length + 1) + '" data-bind="plan.items.0.questions" data-lines>' + esc(it.questions.join(String.fromCharCode(10))) + '</textarea>';
  if (pl.items.length > 1) h += '<p class="tip">These insights were built with ' + pl.items.length + ' themes before the change to one focus. <button class="link" data-act="build">Rebuild</button> to get a single focus, or keep this one.</p>';
  h += '</div>';
  h += '<div class="card" style="margin-bottom:14px"><div class="grid g2"><div><label class="f">Overall picture across ' + calls.length + ' call' + (calls.length === 1 ? '' : 's') + '</label><textarea class="in" rows="4" data-bind="plan.summary">' + esc(pl.summary) + '</textarea></div><div><label class="f">Strengths to recognise (one per line)</label><textarea class="in" rows="4" data-bind="plan.strengths" data-lines>' + esc((pl.strengths || []).join('\n')) + '</textarea></div></div></div>';
  h += '<div class="section-t"><h2>Insights by QA group</h2></div><div class="grid g2">' + GROUPS.map(g => {
    const x = (pl.groups || {})[g.key] || {};
    if (g.key === 'compliance' && !st.fails && !x.develop && !x.working) return '';
    const p = st.sec[g.key], r = g.key === 'compliance' ? (st.fails ? { label: st.fails + ' fail' + (st.fails > 1 ? 's' : ''), cls: 'r-dnm' } : { label: 'No fails', cls: 'r-exc' }) : ratingPct(p);
    return '<div class="card grp ' + r.cls + '"><div class="stage-h"><h3>' + g.label + '</h3><span class="pill" style="margin-left:auto">' + (isNum(p) && g.key !== 'compliance' ? (p / 20).toFixed(1) + '/5 ' : '') + r.label + '</span></div><label class="f">What is working</label><textarea class="in" rows="3" data-bind="plan.groups.' + g.key + '.working">' + esc(x.working) + '</textarea><label class="f">To develop</label><textarea class="in" rows="3" data-bind="plan.groups.' + g.key + '.develop">' + esc(x.develop) + '</textarea>' + (x.quote ? '<div class="ev"><q>' + esc(x.quote) + '</q><small>' + esc(fmtDate(x.date)) + '</small></div>' : '') + '</div>';
  }).join('') + '</div>';
  h += '<div class="actions"><button class="btn" data-act="go" data-href="#/session/' + s.id + '/pre">Next: pre-session email</button><button class="ghost" data-act="go" data-href="#/session/' + s.id + '/notes">Go to session notes</button><button class="ghost" data-act="go" data-href="#/session/' + s.id + '/prep">Change preparation</button><span class="save">Built ' + (s.planAt ? new Date(s.planAt).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '') + '</span></div>';
  return h;
}
function vNotes(s) {
  const pl = s.plan || {}, n = s.notes || {};
  let h = '';
  if (!s.plan) h += '<div class="callout">No QA insights yet. You can still take notes, or <button class="link" data-act="build">build the insights first</button>.</div>';
  else {
    const fi = (pl.items || [])[0] || {};
    h += '<div class="card" style="margin-bottom:14px;border-left:4px solid var(--g)"><h2>Coaching focus</h2>' + (pl.focus ? '<p style="margin:-4px 0 6px;font-weight:600;font-size:15px">' + esc(pl.focus) + '</p>' : '') + (fi.detail ? '<p style="margin:0 0 8px;color:var(--muted)">' + esc(fi.detail) + '</p>' : '');
    if ((fi.questions || []).length) h += '<div class="kv"><b>Questions you could ask</b><ul class="qlist">' + fi.questions.map(q => '<li>' + esc(q) + '</li>').join('') + '</ul></div>';
    if ((pl.strengths || []).length) h += '<p style="margin:10px 0 0;font-size:13.5px"><b>Strengths to recognise:</b> ' + esc(pl.strengths.join('; ')) + '</p>';
    h += '</div>';
  }
  h += '<div class="grid">' + STAGES.map(g => {
    return '<div class="card stage ' + g.key + '"><div class="notes-stage"><div><div class="stage-h"><span class="L">' + g.L + '</span><div><h3>' + g.label + '</h3><span>' + esc(g.blurb) + '</span></div></div></div><div><label class="f">What ' + esc(first(s.adviser)) + ' said</label><textarea class="in" rows="6" data-bind="notes.' + g.key + '" placeholder="Notes for ' + g.label + '">' + esc(n[g.key] || '') + '</textarea></div></div></div>';
  }).join('');
  h += '<div class="card"><h2>What was agreed</h2><div class="grid g2"><div><label class="f">' + esc(first(s.adviser)) + '\'s commitments</label><textarea class="in" rows="4" data-bind="notes.commitments" placeholder="What they said they will do, in their words">' + esc(n.commitments || '') + '</textarea></div><div><label class="f">Support you will provide</label><textarea class="in" rows="4" data-bind="notes.support" placeholder="For example: listen to two calls together next week">' + esc(n.support || '') + '</textarea></div></div>';
  h += '<label class="f">Follow-up date</label><input class="in" type="date" data-bind="notes.followUp" value="' + esc(n.followUp || '') + '" style="width:auto">';
  h += '<div class="actions"><button class="btn green" data-act="outcome">' + (s.outcome ? 'Rewrite goal and email' : 'Create HiBob goal and email') + '</button>' + (s.outcome ? '<button class="ghost" data-act="go" data-href="#/session/' + s.id + '/outcome">View current goal and email</button>' : '') + '</div></div></div>';
  return h;
}
function vOutcome(s) {
  const o = s.outcome;
  if (!o) return '<div class="card empty">No goal or email yet.<div class="actions" style="justify-content:center"><button class="btn green" data-act="outcome">Create HiBob goal and email</button><button class="ghost" data-act="go" data-href="#/session/' + s.id + '/notes">Back to session notes</button></div></div>';
  const hb = o.hibob || {}, em = o.email || {};
  const cp = p => '<button class="cbtn" data-act="copy" data-path="' + p + '">Copy</button>';
  let h = '<div class="split"><div class="card stage options"><div class="stage-h"><span class="L">★</span><div><h3>HiBob goal</h3><span>Copy each field into the matching box in HiBob</span></div></div>';
  h += '<label class="f">Goal title</label><div class="copyrow"><input class="in" data-bind="outcome.hibob.title" value="' + esc(hb.title) + '" style="font-weight:600">' + cp('outcome.hibob.title') + '</div>';
  h += '<label class="f">Description</label><div class="copyrow"><textarea class="in" rows="5" data-bind="outcome.hibob.description">' + esc(hb.description) + '</textarea>' + cp('outcome.hibob.description') + '</div>';
  h += '<label class="f">Key results</label>' + (hb.keyResults || []).map((k, i) => '<div class="kr"><b>' + (i + 1) + '</b><textarea class="in" rows="2" data-bind="outcome.hibob.keyResults.' + i + '">' + esc(k) + '</textarea>' + cp('outcome.hibob.keyResults.' + i) + '</div>').join('');
  h += '<button class="link" data-act="add-kr" style="font-size:13px">+ Add key result</button>';
  h += '<label class="f">Due date</label><div class="row"><input class="in" type="date" data-bind="outcome.hibob.dueDate" value="' + esc(hb.dueDate || '') + '" style="width:auto"><button class="cbtn" data-act="copy-due">Copy</button></div>';
  h += '<div class="actions"><button class="btn blue sm" data-act="copy-goal">Copy whole goal</button></div></div>';
  h += '<div class="card stage goal"><div class="stage-h"><span class="L">✉</span><div><h3>Recap email to ' + esc(first(s.adviser)) + '</h3><span>Edit, then copy into Outlook</span></div></div>';
  h += '<label class="f">Subject</label><div class="copyrow"><input class="in" data-bind="outcome.email.subject" value="' + esc(em.subject) + '">' + cp('outcome.email.subject') + '</div>';
  h += '<label class="f">Email</label><textarea class="in" rows="20" data-bind="outcome.email.body">' + esc(em.body) + '</textarea>';
  h += '<div class="actions"><button class="btn blue sm" data-act="copy" data-path="outcome.email.body">Copy email</button><button class="ghost" data-act="mailto">Open in Outlook</button></div></div></div>';
  h += '<div class="actions"><button class="btn ' + (s.complete ? '' : 'green') + '" data-act="complete">' + (s.complete ? 'Reopen session' : 'Mark session complete') + '</button><button class="ghost" data-act="outcome">Rewrite from notes</button><button class="ghost" data-act="go" data-href="#/session/' + s.id + '/notes">Back to session notes</button></div>';
  return h;
}

function curSession() { const r = route(); return r.page === 'session' ? SESS[r.a] : null; }
function newSession(name) {
  const a = ADVISERS.find(x => x.name === name) || { name, partner: '' };
  const calls = callsFor(name);
  const lastMonth = calls.length ? String(calls[0].interactionDate).slice(0, 7) : '';
  const pick = calls.filter(c => String(c.interactionDate).startsWith(lastMonth));
  const s = { id: uid(), adviser: name, partner: a.partner, date: today(), callIds: pick.map(c => c.interactionId), prep: {}, notes: {}, createdAt: Date.now(), updatedAt: Date.now() };
  SESS[s.id] = s;
  saveNow(s);
  location.hash = '#/session/' + s.id + '/prep';
}
function goalText(hb) {
  return [hb.title || '', '', hb.description || '', '', 'Key results:', ...(hb.keyResults || []).map((k, i) => (i + 1) + '. ' + k), '', 'Due: ' + fmtDate(hb.dueDate)].join('\n');
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied'); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, s = curSession();
  if (act === 'go') { location.hash = t.dataset.href; return; }
  if (act === 'toggle-call') { const id = t.dataset.cid; openCalls.has(id) ? openCalls.delete(id) : openCalls.add(id); render(); return; }
  if (act === 'win') { winSel = t.dataset.win; render(); return; }
  if (act === 'sfilter') { sessFilter = t.dataset.f; render(); return; }
  if (act === 'new-session') { newSession(t.dataset.adviser); return; }
  if (act === 'reload-qa') { QAerr = ''; render(); loadQA(); return; }
  if (act === 'qa-save') { saveQa(t.dataset.adviser, t.dataset.id); return; }
  if (act === 'qa-del') {
    if (!confirm('Delete this QA call? This cannot be undone.')) return;
    fetch(DBQ + '/' + t.dataset.id + '.json', { method: 'DELETE' }).then(() => toast('QA call deleted')).catch(() => toast('Could not delete', true));
    delete MANUAL[t.dataset.id];
    location.hash = '#/adviser/' + encodeURIComponent(t.dataset.adviser);
    return;
  }
  if (!s) return;
  if (act === 'preset') {
    const all = callsFor(s.adviser), p = t.dataset.preset;
    const list = p.startsWith('m:') ? all.filter(c => String(c.interactionDate).startsWith(p.slice(2))) : p === '30' ? inWindow(all, '30') : p === '5' ? all.slice(0, 5) : p === 'fails' ? all.filter(c => c.result === 'Auto-Fail' || (c.compliance && /fail/i.test(c.compliance.result || ''))) : [];
    s.callIds = list.map(c => c.interactionId); saveSoon(s); render(); return;
  }
  if (act === 'build') { buildPlan(s); return; }
  if (act === 'questions') { buildQuestions(s); return; }
  if (act === 'pre') { buildPre(s); return; }
  if (act === 'copy-pre') { const p = preParts(s); copyRich(p.html, p.plain); return; }
  if (act === 'mailto-pre') { const p = preParts(s); location.href = 'mailto:?subject=' + encodeURIComponent(s.preEmail.subject || '') + '&body=' + encodeURIComponent(p.plain); return; }
  if (act === 'outcome') { buildOutcome(s); return; }
  if (act === 'copy') { copy(String(getPath(s, t.dataset.path) || '')); return; }
  if (act === 'copy-due') { copy(fmtDate(getPath(s, 'outcome.hibob.dueDate'))); return; }
  if (act === 'copy-goal') { copy(goalText(s.outcome.hibob)); return; }
  if (act === 'add-item') { s.plan.items = (s.plan.items || []).concat([{ title: 'New coaching item', detail: '', calls: null, quote: '', date: '' }]); saveSoon(s); render(); return; }
  if (act === 'del-item') { s.plan.items.splice(+t.dataset.i, 1); saveSoon(s); render(); return; }
  if (act === 'add-kr') { s.outcome.hibob.keyResults = (s.outcome.hibob.keyResults || []).concat(['']); saveSoon(s); render(); return; }
  if (act === 'mailto') { const em = s.outcome.email; location.href = 'mailto:?subject=' + encodeURIComponent(em.subject || '') + '&body=' + encodeURIComponent(em.body || ''); return; }
  if (act === 'complete') { s.complete = !s.complete; s.completedAt = s.complete ? Date.now() : null; saveNow(s); render(); toast(s.complete ? 'Session marked complete' : 'Session reopened'); return; }
  if (act === 'del') {
    if (!confirm('Delete this coaching session for ' + s.adviser + '? This cannot be undone.')) return;
    fetch(DB + '/' + s.id + '.json', { method: 'DELETE' }).then(() => toast('Session deleted')).catch(() => toast('Could not delete', true));
    delete SESS[s.id];
    location.hash = '#/adviser/' + encodeURIComponent(s.adviser);
  }
});
document.addEventListener('input', e => {
  const el = e.target, p = el.dataset && el.dataset.bind;
  if (!p) return;
  const s = curSession(); if (!s) return;
  let v = el.value;
  if (el.hasAttribute('data-lines')) v = v.split('\n').map(x => x.trim()).filter(Boolean);
  setPath(s, p, v);
  saveSoon(s);
  if (el.hasAttribute('data-rerender') && $('#prePreview')) $('#prePreview').innerHTML = preParts(s).html;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.call) {
    const s = curSession(); if (!s) return;
    const set = new Set(s.callIds || []);
    el.checked ? set.add(el.dataset.call) : set.delete(el.dataset.call);
    s.callIds = [...set];
    saveSoon(s);
    const y = window.scrollY, box = document.querySelector('.pick-list'), sy = box ? box.scrollTop : 0;
    render();
    window.scrollTo(0, y);
    const nb = document.querySelector('.pick-list'); if (nb) nb.scrollTop = sy;
  } else if (el.dataset && el.dataset.precall) {
    const s = curSession(); if (!s || !s.preEmail) return;
    const id = el.dataset.precall, list = s.preEmail.calls || [];
    s.preEmail.calls = el.checked ? list.concat([{ id, why: '' }]) : list.filter(x => x.id !== id);
    saveSoon(s);
    render();
  } else if (el.dataset && el.dataset.bind === 'date') render();
});
let lastAdv = '';
window.addEventListener('hashchange', () => { const r = route(); if (r.page === 'adviser' && r.a !== lastAdv) { winSel = ''; lastAdv = r.a; } render(); window.scrollTo(0, 0); });
window.addEventListener('beforeunload', e => { if ($('#saveState').textContent === 'Saving…') { e.preventDefault(); e.returnValue = ''; } });
if (!location.hash) location.hash = '#/advisers';
render();
loadSessions();
loadManual().then(() => { manualLoaded = true; render(); });
loadQA();
</script>
</body>
</html>
